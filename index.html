<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="title"></h1>
    <p id="description"></p>

    <form id="survey-form">
        <label for="name" id="name-label">Name</label><br>
        <input id="name" type="text" name="name" placeholder="Enter your name" required><br>

        <label for="email" id="email-label">Email</label><br>
        <input type="email" name="email" id="email" placeholder="Enter your email" required><br>

        <label for="number" id="number-label">Number (optional)</label><br>
        <input id="number" type="number" min="18" max="90" name="number" placeholder="e.g. 18, 90" required><br>

        <select id="dropdown" name="role" required>
            <option disabled selected value>Select your role</option>
            <option value="student">Student</option>
            <option value="full-time-job">Full Time Job</option>
    </form>
</body>
</html>
